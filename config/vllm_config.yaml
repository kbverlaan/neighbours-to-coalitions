# vLLM on Snellius — main runner backend. No API key needed.

api_key_env_var: ""
base_url: "http://localhost:8000/v1"

model: "/path/to/Qwen3.5-27B"

temperature: 0.3
max_tokens: 16000       # thinking-CoT grows to 8K+ at a full window; 8000 caused truncation+retries (OpenRouter lab)
timeout: 900              # thinking models: ~6K tokens @ 30 tok/s + overhead
retry_attempts: 3
retry_delay: 5

prompt_config:
  tom_level: "level0"
